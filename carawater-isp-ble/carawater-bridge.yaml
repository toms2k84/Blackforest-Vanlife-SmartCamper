# Pumpen-Brücke: ESP32 (D0WD-V3, 4 MB) in Pumpennähe, steuert die CARAWATER ISP 15 direkt per Bluetooth
# (unabhängig vom VAN PI) und arbeitet zusätzlich als Bluetooth-Proxy für HA.
# Protokoll siehe README.md in diesem Ordner (Mitschnitt der CARAWATER-App vom 08.11.2026).

substitutions:
  name: carawater-bridge
  friendly_name: Pumpen-Bridge
  pumpe_mac: "XX:XX:XX:XX:XX:XX"
  svc: "0000ff00-0000-1000-8000-00805f9b34fb"
  chr_write: "0000ff02-0000-1000-8000-00805f9b34fb"
  chr_notify: "0000ff01-0000-1000-8000-00805f9b34fb"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: "__API_KEY__"

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

time:
  - platform: homeassistant
    id: ha_time

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true

ble_client:
  - mac_address: ${pumpe_mac}
    id: pumpe
    auto_connect: true
    on_connect:
      - logger.log: "Pumpe verbunden"
      - delay: 2s
      - script.execute: abfrage
    on_disconnect:
      - logger.log: "Pumpe getrennt"

globals:
  # zuletzt gemeldeter Betriebsbyte (Bit 0 = an, Bits 5–6 = Druckstufe); 0x21 = an, Stufe 1
  - id: modus
    type: uint8_t
    initial_value: "0x21"
  - id: letzte_stufe
    type: int
    initial_value: "0"
  # Statusantwort kommt ggf. in BLE-Stücken (20 Byte) – hier zusammensetzen
  - id: puffer
    type: std::vector<uint8_t>
  - id: letzte_roh
    type: std::string

script:
  # Abfrage/Keepalive wie die App: 55 MM HH WT CS
  - id: abfrage
    then:
      - ble_client.ble_write:
          id: pumpe
          service_uuid: ${svc}
          characteristic_uuid: ${chr_write}
          value: !lambda |-
            auto t = id(ha_time).now();
            uint8_t mm = t.is_valid() ? t.minute : 0, hh = t.is_valid() ? t.hour : 0;
            uint8_t wt = t.is_valid() ? (t.day_of_week == 1 ? 7 : t.day_of_week - 1) : 1;
            std::vector<uint8_t> v = {0x55, mm, hh, wt};
            uint8_t cs = 0; for (auto b : v) cs += b; v.push_back(cs);
            return v;

  # Schaltbefehl: aa 39 MODE 00 00 00 MM HH WT + 50 × 00 + CS (60 Byte)
  - id: senden
    parameters:
      neu: int
    then:
      - ble_client.ble_write:
          id: pumpe
          service_uuid: ${svc}
          characteristic_uuid: ${chr_write}
          value: !lambda |-
            auto t = id(ha_time).now();
            uint8_t mm = t.is_valid() ? t.minute : 0, hh = t.is_valid() ? t.hour : 0;
            uint8_t wt = t.is_valid() ? (t.day_of_week == 1 ? 7 : t.day_of_week - 1) : 1;
            std::vector<uint8_t> v(60, 0);
            v[0] = 0xaa; v[1] = 0x39; v[2] = (uint8_t) neu; v[6] = mm; v[7] = hh; v[8] = wt;
            uint8_t cs = 0; for (int i = 0; i < 59; i++) cs += v[i]; v[59] = cs;
            ESP_LOGI("pumpe", "Sende Modus 0x%02X", (uint8_t) neu);
            return v;
      - delay: 1s
      - script.execute: abfrage

interval:
  - interval: 10s
    then:
      - if:
          condition:
            lambda: 'return id(pumpe).connected();'
          then:
            - script.execute: abfrage

sensor:
  # Statusmeldungen der Pumpe: aa 45 MODE …
  - platform: ble_client
    type: characteristic
    ble_client_id: pumpe
    id: pumpe_status
    internal: true
    service_uuid: ${svc}
    characteristic_uuid: ${chr_notify}
    notify: true
    lambda: |-
      // Rohdaten sammeln: neue Statusantwort beginnt mit aa 45, Folgestücke anhängen
      bool anfang = x.size() >= 2 && x[0] == 0xaa && x[1] == 0x45;
      if (anfang) id(puffer).clear();
      if (anfang || !id(puffer).empty()) {
        id(puffer).insert(id(puffer).end(), x.begin(), x.end());
        if (id(puffer).size() >= 60 || x.size() < 20) {
          std::string hex;
          char b[4];
          for (auto c : id(puffer)) { snprintf(b, sizeof(b), "%02x", c); hex += b; }
          if (hex != id(letzte_roh)) {
            id(letzte_roh) = hex;
            ESP_LOGD("pumpe", "Status roh (%u): %s", (unsigned) id(puffer).size(), hex.c_str());
            id(pumpe_roh).publish_state(hex);
          }
          id(puffer).clear();
        }
      }
      // Messwerte (entschlüsselt 09.11.2026, Zapftest 5 l): siehe README.md
      if (x.size() >= 122 && x[0] == 0xaa && x[1] == 0x45) {
        id(pumpe_laeuft).publish_state(x[2] & 0x10);
        id(pumpe_spannung).publish_state(x[6] / 10.0f);
        id(pumpe_strom).publish_state(x[8] / 10.0f);
        id(pumpe_druck).publish_state((x[10] | (x[11] << 8)) / 100.0f);
        id(pumpe_durchfluss).publish_state(x[14] / 10.0f);
        id(pumpe_liter_heute).publish_state((float) (x[16] | (x[17] << 8)));
        id(pumpe_temperatur).publish_state((float) x[18]);
        id(pumpe_zaehler_a).publish_state((x[101] | (x[102] << 8)) / 10.0f);
        id(pumpe_zaehler_b).publish_state((x[119] | (x[120] << 8)) / 10.0f);
      }
      if (x.size() >= 3 && x[0] == 0xaa && x[1] == 0x45) {
        if (x[2] != id(modus)) ESP_LOGI("pumpe", "Status: Modus 0x%02X", x[2]);
        id(modus) = x[2];
        id(pumpe_schalter).publish_state(x[2] & 0x01);
        int stufe = (x[2] >> 5) & 0x03;
        if (stufe >= 1 && stufe <= 3 && stufe != id(letzte_stufe)) {
          id(letzte_stufe) = stufe;
          id(druckstufe).publish_state(to_string(stufe));
        }
        return (float) x[2];
      }
      return {};
  # Messwerte aus der Statusantwort (Pumpe sendet alle ~2 s, solange sie Strom hat)
  - platform: template
    id: pumpe_spannung
    name: Pumpe Spannung
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - or: [throttle: 60s, delta: 0.3]
  - platform: template
    id: pumpe_strom
    name: Pumpe Strom
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - or: [throttle: 60s, delta: 0.5]
  - platform: template
    id: pumpe_druck
    name: Wasserdruck
    unit_of_measurement: bar
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - or: [throttle: 60s, delta: 0.2]
  - platform: template
    id: pumpe_durchfluss
    name: Wasser Durchfluss
    unit_of_measurement: L/min
    device_class: volume_flow_rate
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - or: [throttle: 60s, delta: 0.5]
  - platform: template
    id: pumpe_liter_heute
    name: Wasser heute (Pumpe)
    unit_of_measurement: L
    device_class: water
    state_class: total_increasing
    accuracy_decimals: 0
    filters:
      - delta: 1
  - platform: template
    id: pumpe_zaehler_a
    name: Pumpe Zähler A
    unit_of_measurement: L
    device_class: water
    state_class: total_increasing
    accuracy_decimals: 1
    filters:
      - delta: 0.5
  - platform: template
    id: pumpe_zaehler_b
    name: Pumpe Zähler B
    unit_of_measurement: L
    device_class: water
    state_class: total_increasing
    accuracy_decimals: 1
    filters:
      - delta: 0.5
  - platform: template
    id: pumpe_temperatur
    name: Pumpe Temperatur
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - or: [throttle: 300s, delta: 1]
  - platform: ble_client
    type: rssi
    ble_client_id: pumpe
    name: Pumpe Bluetooth-Signal
    entity_category: diagnostic
  - platform: uptime
    name: Laufzeit
    entity_category: diagnostic
  - platform: debug
    free:
      name: Freier Speicher
      entity_category: diagnostic
  - platform: wifi_signal
    name: WLAN-Signal
    update_interval: 60s
    entity_category: diagnostic

binary_sensor:
  - platform: template
    id: pumpe_laeuft
    name: Pumpe läuft
    device_class: running
  - platform: template
    name: Pumpe verbunden
    device_class: connectivity
    entity_category: diagnostic
    lambda: 'return id(pumpe).connected();'

switch:
  - platform: template
    id: pumpe_schalter
    name: Wasserpumpe direkt
    icon: mdi:water-pump
    optimistic: false
    # beim Start nichts senden – der Zustand kommt von der Pumpe
    restore_mode: DISABLED
    turn_on_action:
      - script.execute: { id: senden, neu: !lambda 'return (id(modus) & 0x60 ? (id(modus) & 0x60) : 0x20) | 0x01;' }
    turn_off_action:
      - script.execute: { id: senden, neu: !lambda 'return (id(modus) & 0x60 ? (id(modus) & 0x60) : 0x20);' }

select:
  - platform: template
    id: druckstufe
    name: Pumpe Druckstufe
    icon: mdi:gauge
    options: ["1", "2", "3"]
    optimistic: false
    restore_value: false
    set_action:
      - script.execute:
          id: senden
          neu: !lambda 'return (atoi(x.c_str()) << 5) | (id(modus) & 0x01);'

debug:
  update_interval: 60s

text_sensor:
  # komplette Statusantwort als Hex – zum Entschlüsseln von Spannung, Strom, Druck, Durchfluss …
  - platform: template
    id: pumpe_roh
    name: Pumpe Rohdaten
    icon: mdi:code-brackets
    entity_category: diagnostic
    disabled_by_default: true
  - platform: debug
    reset_reason:
      name: Letzter Neustart-Grund
      entity_category: diagnostic
  - platform: wifi_info
    ip_address:
      name: IP-Adresse
      entity_category: diagnostic
