# ---------------------------------------------------------------- Hilfsfunktionen

globals:
  # Webasto-Soll, das bei ausgeschalteter Heizung erst beim Start gesendet wird
  - id: wb_soll
    type: int
    initial_value: '20'
  - id: warn_aktiv
    type: bool
    initial_value: 'false'

script:
  - id: update_status
    mode: queued
    then:
      - lvgl.label.update:
          id: lbl_warn
          text: !lambda |-
            std::string w;
            auto add = [&](const char *s) { if (!w.empty()) w += "  ·  "; w += s; };
            if (id(w_rauch).state) add("RAUCH");
            if (id(w_leck_klappe).state || id(w_leck_wc).state) add("Wasserleck");
            if (id(ha_t_pumpe).state < 3 || id(ha_t_tank).state < 3) add("Frost Wasser");
            else if (id(ha_t_aussen).state < 2) add("Frostgefahr");
            if (id(ha_kond).state < 1) add("Kondenswasser");
            if (id(w_tuer).state) add("Tür offen");
            if (id(w_garage_f).state || id(w_garage_b).state) add("Garage offen");
            id(warn_aktiv) = !w.empty();
            return w;
      - if:
          condition:
            lambda: 'return id(warn_aktiv);'
          then:
            - lvgl.widget.hide: chip_ok
            - lvgl.widget.show: chip_warn
          else:
            - lvgl.widget.hide: chip_warn
            - lvgl.widget.show: chip_ok
      - lvgl.label.update:
          id: lbl_sb_soc
          text: !lambda 'return isnan(id(ha_soc).state) ? std::string("–") : str_sprintf("%.0f %%", id(ha_soc).state);'
      - lvgl.label.update:
          id: lbl_sb_temp
          text: !lambda 'return isnan(id(ha_t_aussen).state) ? std::string("–") : [](std::string s) { for (auto &ch : s) if (ch == ''.'') ch = '',''; return s; }(str_sprintf("%.1f °C", id(ha_t_aussen).state));'
  - id: update_battery_detail
    mode: queued
    then:
      - lvgl.label.update:
          id: lbl_batt_a_home
          text: !lambda 'return isnan(id(ha_batt_a).state) ? std::string("") : [](std::string s) { for (auto &ch : s) if (ch == ''.'') ch = '',''; return s; }(str_sprintf("%+.1f A", id(ha_batt_a).state));'
      - lvgl.label.update:
          id: lbl_batt_detail
          text: !lambda |-
            float a = id(ha_batt_a).state, v = id(ha_batt_v).state;
            std::string s = isnan(v) ? std::string("–") : [](std::string s) { for (auto &ch : s) if (ch == '.') ch = ','; return s; }(str_sprintf("%.2f V", v));
            if (!isnan(a)) s += "   " + [](std::string s) { for (auto &ch : s) if (ch == '.') ch = ','; return s; }(str_sprintf("%+.1f A", a)) + (a > 0.2 ? "  lädt" : a < -0.2 ? "  entlädt" : "");
            return s;
  - id: update_powerstation
    mode: queued
    then:
      - lvgl.label.update:
          id: lbl_ps_detail
          text: !lambda 'return str_sprintf("rein %.0f W · raus %.0f W", isnan(id(ha_ps_in).state) ? 0.0f : id(ha_ps_in).state, isnan(id(ha_ps_out).state) ? 0.0f : id(ha_ps_out).state);'
  - id: update_water_temps
    mode: queued
    then:
      - lvgl.label.update:
          id: lbl_water_temps
          text: !lambda |-
            auto t = [](float v) { return isnan(v) ? std::string("–") : [](std::string s) { for (auto &ch : s) if (ch == '.') ch = ','; return s; }(str_sprintf("%.1f °C", v)); };
            auto c = [](float v) { return (!isnan(v) && v < 3) ? std::string("#ef4444 ") : std::string(""); };
            auto e = [](float v) { return (!isnan(v) && v < 3) ? std::string("#") : std::string(""); };
            float tk = id(ha_t_tank).state, pu = id(ha_t_pumpe).state, gr = id(ha_t_grau).state;
            return "Frischwassertank  " + c(tk) + t(tk) + e(tk) + "\nPumpe  " + c(pu) + t(pu) + e(pu) + "\nGrauwasser  " + c(gr) + t(gr) + e(gr);
  - id: update_climate
    mode: queued
    then:
      - lvgl.label.update:
          id: lbl_innen_home
          text: !lambda 'return isnan(id(ha_t_innen).state) ? std::string("–") : [](std::string s) { for (auto &ch : s) if (ch == ''.'') ch = '',''; return s; }(str_sprintf("%.1f °C", id(ha_t_innen).state));'
      - lvgl.label.update:
          id: lbl_aussen_home
          text: !lambda 'return isnan(id(ha_t_aussen).state) ? std::string("–") : [](std::string s) { for (auto &ch : s) if (ch == ''.'') ch = '',''; return s; }(str_sprintf("%.1f °C", id(ha_t_aussen).state));'
      - lvgl.label.update:
          id: lbl_innen
          text: !lambda 'return isnan(id(ha_t_innen).state) ? std::string("–") : [](std::string s) { for (auto &ch : s) if (ch == ''.'') ch = '',''; return s; }(str_sprintf("%.1f °C", id(ha_t_innen).state));'
      - lvgl.label.update:
          id: lbl_innen_detail
          text: !lambda |-
            std::string s;
            if (!isnan(id(ha_rh_innen).state)) s += str_sprintf("Luftfeuchte %.0f %%", id(ha_rh_innen).state);
            if (!isnan(id(ha_taupunkt).state)) s += "   Taupunkt " + [](std::string s) { for (auto &ch : s) if (ch == '.') ch = ','; return s; }(str_sprintf("%.1f °C", id(ha_taupunkt).state));
            return s;
      - lvgl.label.update:
          id: lbl_sitz_aussen
          text: !lambda |-
            auto t = [](float v) { return isnan(v) ? std::string("–") : [](std::string s) { for (auto &ch : s) if (ch == '.') ch = ','; return s; }(str_sprintf("%.1f °C", v)); };
            return "Sitzecke " + t(id(ha_t_sitz).state) + "     Außen " + t(id(ha_t_aussen).state);

interval:
  - interval: 10s
    then:
      - lvgl.label.update:
          id: lbl_clock
          text: !lambda |-
            auto now = id(ha_time).now();
            return now.is_valid() ? now.strftime("%H:%M") : std::string("--:--");

