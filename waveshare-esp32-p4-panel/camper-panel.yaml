text_sensor:
  - platform: homeassistant
    id: ha_druckstufe
    entity_id: select.pumpen_bridge_pumpe_druckstufe
    on_value:
      - lambda: |-
          lv_obj_t *k[6] = {id(btn_dsh1), id(btn_dsh2), id(btn_dsh3), id(btn_dsw1), id(btn_dsw2), id(btn_dsw3)};
          for (int i = 0; i < 6; i++) {
            bool an = x == to_string(i % 3 + 1);
            if (an) lv_obj_add_state(k[i], LV_STATE_CHECKED); else lv_obj_clear_state(k[i], LV_STATE_CHECKED);
          }
  - platform: homeassistant
    id: ha_ac_state
    entity_id: climate.dometicklima_dometic_freshjet
    on_value:
      - lvgl.label.update:
          id: lbl_ac_state
          text: !lambda |-
            if (x == "off") return std::string("Aus");
            if (x == "cool") return std::string("Kühlen");
            if (x == "heat") return std::string("Heizen");
            if (x == "fan_only") return std::string("Lüften");
            if (x == "heat_cool") return std::string("Auto");
            if (x == "dry") return std::string("Entfeuchten");
            if (x == "unavailable") return std::string("nicht verfügbar");
            return x;
      - lvgl.label.update:
          id: lbl_ac_mode
          text: !lambda |-
            if (x == "cool") return std::string("Modus: Kühlen");
            if (x == "heat") return std::string("Modus: Heizen");
            if (x == "fan_only") return std::string("Modus: Lüften");
            if (x == "heat_cool") return std::string("Modus: Auto");
            if (x == "dry") return std::string("Modus: Entf.");
            return std::string("Modus");
      - lvgl.widget.update: { id: btn_acm_0, state: { checked: !lambda 'return x == "off";' } }
      - lvgl.widget.update: { id: btn_acm_1, state: { checked: !lambda 'return x == "cool";' } }
      - lvgl.widget.update: { id: btn_acm_2, state: { checked: !lambda 'return x == "heat";' } }
      - lvgl.widget.update: { id: btn_acm_3, state: { checked: !lambda 'return x == "fan_only";' } }
      - lvgl.widget.update: { id: btn_acm_4, state: { checked: !lambda 'return x == "heat_cool";' } }
      - lvgl.widget.update: { id: btn_acm_5, state: { checked: !lambda 'return x == "dry";' } }
      - lvgl.widget.update: { id: btn_ac_power, state: { checked: !lambda 'return x != "off" && x != "unavailable";' } }
  - platform: homeassistant
    id: ha_ac_fan
    entity_id: climate.dometicklima_dometic_freshjet
    attribute: fan_mode
    on_value:
      - lvgl.label.update:
          id: lbl_ac_fan
          text: !lambda |-
            if (x == "auto") return std::string("Lüfter A");
            if (x == "low") return std::string("Lüfter 1");
            if (x == "medium") return std::string("Lüfter 2");
            if (x == "high") return std::string("Lüfter 3");
            if (x == "Turbo") return std::string("Turbo");
            return std::string("Lüfter");
      - lvgl.widget.update: { id: btn_acf_0, state: { checked: !lambda 'return x == "auto";' } }
      - lvgl.widget.update: { id: btn_acf_1, state: { checked: !lambda 'return x == "low";' } }
      - lvgl.widget.update: { id: btn_acf_2, state: { checked: !lambda 'return x == "medium";' } }
      - lvgl.widget.update: { id: btn_acf_3, state: { checked: !lambda 'return x == "high";' } }
      - lvgl.widget.update: { id: btn_acf_4, state: { checked: !lambda 'return x == "Turbo";' } }
  - platform: homeassistant
    id: ha_webasto_status
    entity_id: sensor.webasto_webasto_status
    on_value:
      - lvgl.label.update:
          id: lbl_webasto_status
          text: !lambda 'return x;'
      - lvgl.label.update:
          id: lbl_webasto_home
          text: !lambda 'return x;'
  - platform: homeassistant
    id: ha_webasto_mode
    entity_id: select.webasto_webasto_heizmodus
    on_value:
      - lvgl.label.update:
          id: lbl_webasto_mode
          text: !lambda 'return "Modus: " + x;'
      - lvgl.widget.update: { id: btn_wbm_0, state: { checked: !lambda 'return x == "Eco";' } }
      - lvgl.widget.update: { id: btn_wbm_1, state: { checked: !lambda 'return x == "Normal";' } }
      - lvgl.widget.update: { id: btn_wbm_2, state: { checked: !lambda 'return x == "Boost";' } }
  - platform: homeassistant
    id: ha_ventil
    entity_id: cover.pekaway_van_pi_grauwasser_ventil
    on_value:
      - lvgl.label.update:
          id: lbl_ventil
          text: !lambda |-
            if (x == "open") return std::string("offen");
            if (x == "closed") return std::string("geschlossen");
            if (x == "opening") return std::string("öffnet …");
            if (x == "closing") return std::string("schließt …");
            if (x == "unavailable") return std::string("nicht verfügbar");
            return x;
  - platform: homeassistant
    id: ha_dplus
    entity_id: switch.pekaway_van_pi_d_plus
    on_value:
      - lvgl.label.update:
          id: lbl_dplus
          text: !lambda 'return x == "on" ? std::string("an – Motor läuft") : x == "off" ? std::string("aus") : std::string("nicht verfügbar");'

