# Camper-Panel: Waveshare ESP32-P4-WIFI6-Touch-LCD-7B (1024×600, GT911, WLAN über ESP32-C6)
# Hardware-Teil nach der erprobten Community-Konfiguration (HA-Forum, Thread 945864, Beitrag #26/#33).
# Die Logik bleibt in HA/Node-RED; das Panel zeigt nur an und löst HA-Aktionen aus.

substitutions:
  name: camper-panel
  friendly_name: Camper-Panel
  # Farben
  c_bg: "0x111418"
  c_card: "0x1E232A"
  c_card_on: "0x2B4A6F"
  c_accent: "0x3B8EE8"
  c_text: "0xF2F4F7"
  c_dim: "0x9AA4B2"
  c_green: "0x22C55E"
  c_orange: "0xF59E0B"
  c_red: "0xEF4444"
  glyphs: " !#%&'()*+,-./0123456789:;<=>?ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyzÄÖÜäöüß°–·…"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  variant: esp32p4
  flash_size: 32MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
    sdkconfig_options:
      CONFIG_SPIRAM_SPEED_200M: y
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "60"

esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true

psram:
  mode: hex
  speed: 200MHz

preferences:
  flash_write_interval: 5min

esp_ldo:
  - voltage: 2.5V
    channel: 3

logger:
  level: INFO

api:
  encryption:
    key: "__API_KEY__"

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

time:
  - platform: homeassistant
    id: ha_time

# ---------------------------------------------------------------- Hardware

i2c:
  - id: bus_a
    sda: GPIO07
    scl: GPIO08
    frequency: 400kHz

touchscreen:
  - platform: gt911
    id: touch
    i2c_id: bus_a
    reset_pin: GPIO23
    update_interval: 50ms
    # Bild ist per LVGL um 180° gedreht, der Touch muss dazu gespiegelt werden
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: true
    on_release:
      # Antippen weckt das Display; der erste Tipp nach dem Aufwachen löst nichts aus.
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - light.turn_on:
          id: backlight
          brightness: 100%

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO32
    inverted: true
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: Display-Helligkeit
    id: backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

display:
  - platform: mipi_dsi
    id: main_display
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-7B
    reset_pin:
      number: 33
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 1024
      height: 600

# ---------------------------------------------------------------- Schriften (mit Umlauten und °)

font:
  - file: "gfonts://Roboto"
    id: f_s
    size: 20
    glyphs: ${glyphs}
    # 8 bit: große Glyphen zeichnet der P4 per PPA, der kann keine 1-Bit-Masken (Text wurde fast unsichtbar)
    bpp: 8
  - file: "gfonts://Roboto"
    id: f_xs
    size: 16
    glyphs: ${glyphs}
    # 8 bit: große Glyphen zeichnet der P4 per PPA, der kann keine 1-Bit-Masken (Text wurde fast unsichtbar)
    bpp: 8
  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: f_m
    size: 26
    glyphs: ${glyphs}
    # 8 bit: große Glyphen zeichnet der P4 per PPA, der kann keine 1-Bit-Masken (Text wurde fast unsichtbar)
    bpp: 8
  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: f_l
    size: 38
    glyphs: ${glyphs}
    # 8 bit: große Glyphen zeichnet der P4 per PPA, der kann keine 1-Bit-Masken (Text wurde fast unsichtbar)
    bpp: 8
  - file:
      type: gfonts
      family: Roboto
      weight: 500
    id: f_xl
    size: 56
    glyphs: ${glyphs}
    # 8 bit: große Glyphen zeichnet der P4 per PPA, der kann keine 1-Bit-Masken (Text wurde fast unsichtbar)
    bpp: 8



  - file:
      type: web
      url: https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf
    id: f_icon
    size: 36
    bpp: 8
