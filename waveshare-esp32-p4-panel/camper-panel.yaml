          x: 0
          y: 0
          width: 1024
          height: 56
          bg_color: 0x0A0C10
          border_width: 0
          radius: 0
          pad_all: 0
          scrollbar_mode: "OFF"
          widgets:
            - label: { id: lbl_clock, text: "--:--", text_font: f_m, text_color: 0xF2F4F7, align: LEFT_MID, x: 20 }
            - obj:
                id: chip_ok
                align: CENTER
                width: 230
                height: 34
                radius: 17
                bg_color: 0x12301F
                border_width: 0
                pad_all: 0
                widgets:
                  - label: { text: "\U000F05E0", text_font: f_icon_s, text_color: 0x22C55E, align: LEFT_MID, x: 14 }
                  - label: { text: "Alles in Ordnung", text_font: f_s, text_color: 0x22C55E, align: LEFT_MID, x: 44 }
            - obj:
                id: chip_warn
                hidden: true
                align: CENTER
                width: 480
                height: 34
                radius: 17
                bg_color: 0x3A1518
                border_width: 0
                pad_all: 0
                widgets:
                  - label: { text: "\U000F0028", text_font: f_icon_s, text_color: 0xEF4444, align: LEFT_MID, x: 14 }
                  - label: { id: lbl_warn, text: "", text_font: f_s, text_color: 0xEF4444, align: LEFT_MID, x: 44 }
            - label: { text: "\U000F0084", text_font: f_icon_s, text_color: 0x22C55E, align: RIGHT_MID, x: -186 }
            - label: { id: lbl_sb_soc, text: "–", text_font: f_s, text_color: 0x9AA4B2, align: LEFT_MID, x: 846 }
