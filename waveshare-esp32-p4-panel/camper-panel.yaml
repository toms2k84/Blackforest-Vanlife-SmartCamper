# ---------------------------------------------------------------- Oberfläche
# Jede Kachel und jedes Label bekommt eine ausdrückliche Textfarbe: ohne sie zeichnet das
# Standard-Theme die Schrift fast in Kachelfarbe.

lvgl:
  # Bild um 180° drehen, damit es im Gehäuse richtig herum steht
  rotation: 180
  buffer_size: 100%
  byte_order: little_endian
  displays: [main_display]
  touchscreens: [touch]
  bg_color: 0x0E1116
  text_font: f_s
  text_color: 0xF2F4F7
  # Nach 1 min dimmen, nach 5 min aus
  on_idle:
    - timeout: 60s
      then:
        - light.turn_on:
            id: backlight
            brightness: 25%
    - timeout: 300s
      then:
        - light.turn_off: backlight
        - lvgl.pause:

  style_definitions:
    - id: st_card
      bg_color: 0x181C22
      bg_opa: 82%
      text_color: 0xF2F4F7
      radius: 18
      border_width: 0
      shadow_width: 0
      pad_all: 16
    - id: st_tile
      bg_color: 0x181C22
      bg_opa: 82%
      text_color: 0x5C6470
      radius: 18
      border_width: 0
      shadow_width: 0
      pad_all: 14
    - id: st_nav
      bg_opa: TRANSP
      text_color: 0x9AA4B2
      radius: 12
      border_width: 0
      shadow_width: 0
      pad_all: 0
    - id: st_dim
      text_color: 0x9AA4B2
      text_font: f_xs

  theme:
    button:
      bg_color: 0x181C22
      radius: 18
      border_width: 0
      shadow_width: 0
      text_font: f_m
      pressed:
        bg_color: 0x2A3340

